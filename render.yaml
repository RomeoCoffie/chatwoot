# render.yaml (no previews block)

envVarGroups:
  - name: chatwoot-common
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: MAILER_SENDER_EMAIL
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_AUTHENTICATION
        value: "plain"
      - key: SMTP_ENABLE_STARTTLS_AUTO
        value: "true"
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      - key: FB_APP_ID
        value: "1073581627844703"          
      - key: FB_APP_SECRET
        value: "de76c64d6afbc8848d266750a511e92c"          
      - key: FB_VERIFY_TOKEN
        value: "mywootsuper184"   

databases:
  - name: chatwoot-db
    plan: free

services:
  - type: keyvalue
    name: chatwoot-redis
    plan: free
    ipAllowList: []

  - type: web
    name: chatwoot-web
    runtime: docker
    plan: starter
    healthCheckPath: /
    # Enable this AFTER the DB is healthy:
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"
    dockerCommand: /app/docker/entrypoints/rails.sh bundle exec rails s -p $PORT -b 0.0.0.0
    envVars:
      - fromGroup: chatwoot-common
      - key: DATABASE_URL
        value: "postgres://chatwoot_db_xap8_user:01NsaSpYin38EvYyB0QrLrTeCxRYwr2Z@dpg-d2luddruibrs73fkr340-a:5432/chatwoot_db_xap8?sslmode=require"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatwoot-redis
          property: connectionString
      - key: POSTGRES_HOST
        value: "dpg-d2luddruibrs73fkr340-a"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: "chatwoot_db_xap8"
      - key: POSTGRES_USERNAME
        value: "chatwoot_db_xap8_user"
      - key: POSTGRES_PASSWORD
        value: "01NsaSpYin38EvYyB0QrLrTeCxRYwr2Z"
    disk:
      name: chatwoot-uploads
      mountPath: /app/storage
      sizeGB: 5

  - type: worker
    name: chatwoot-worker
    runtime: docker
    plan: starter
    # Normal Sidekiq command:
    dockerCommand: /app/docker/entrypoints/rails.sh bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - fromGroup: chatwoot-common
      - key: DATABASE_URL
        value: "postgres://chatwoot_db_xap8_user:01NsaSpYin38EvYyB0QrLrTeCxRYwr2Z@dpg-d2luddruibrs73fkr340-a:5432/chatwoot_db_xap8?sslmode=require"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatwoot-redis
          property: connectionString
      - key: POSTGRES_HOST
        value: "dpg-d2luddruibrs73fkr340-a"
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: "chatwoot_db_xap8"
      - key: POSTGRES_USERNAME
        value: "chatwoot_db_xap8_user"
      - key: POSTGRES_PASSWORD
        value: "01NsaSpYin38EvYyB0QrLrTeCxRYwr2Z"
