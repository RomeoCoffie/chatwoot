# render.yaml  (no previews block)
envVarGroups:
  - name: chatwoot-common
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: MAILER_SENDER_EMAIL
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_AUTHENTICATION
        value: "plain"
      - key: SMTP_ENABLE_STARTTLS_AUTO
        value: "true"
      - key: ACTIVE_STORAGE_SERVICE
        value: local

databases:
  - name: chatwoot-db
    plan: free         # you can change to starter later

services:
  - type: keyvalue
    name: chatwoot-redis
    plan: free
    ipAllowList: []

  - type: web
    name: chatwoot-web
    runtime: docker
    plan: starter
    healthCheckPath: /
    preDeployCommand: "bundle exec rails db:chatwoot_prepare"
    dockerCommand: "/app/docker/entrypoints/rails.sh && bundle exec rails s -p $PORT -b 0.0.0.0"
    envVars:
      - fromGroup: chatwoot-common
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatwoot-redis
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: chatwoot-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: chatwoot-db
          property: database
      - key: POSTGRES_USERNAME
        fromDatabase:
          name: chatwoot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chatwoot-db
          property: password
      - key: POSTGRES_PORT
        value: "5432"

    disk:
      name: chatwoot-uploads
      mountPath: /app/storage
      sizeGB: 5

  - type: worker
    name: chatwoot-worker
    runtime: docker
    plan: starter
    dockerCommand: "/app/docker/entrypoints/rails.sh && bundle exec sidekiq -C config/sidekiq.yml"
    envVars:
      - fromGroup: chatwoot-common
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatwoot-redis
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: chatwoot-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: chatwoot-db
          property: database
      - key: POSTGRES_USERNAME
        fromDatabase:
          name: chatwoot-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chatwoot-db
          property: password
      - key: POSTGRES_PORT
        value: "5432"

