# render.yaml
previews:
  generation: manual

envVarGroups:
  - name: chatwoot-common
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: docker
      - key: FRONTEND_URL                # e.g., https://support.yourdomain.com
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      # Email (optional; add if you want outbound mail / email channel)
      - key: MAILER_SENDER_EMAIL
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_AUTHENTICATION
        value: "plain"
      - key: SMTP_ENABLE_STARTTLS_AUTO
        value: "true"
      # File storage: keep it all on Render with a persistent disk
      - key: ACTIVE_STORAGE_SERVICE
        value: local

databases:
  - name: chatwoot-db
    plan: free

services:
  - type: keyvalue
    name: chatwoot-redis
    plan: free
    ipAllowList: []  # internal only

  - type: web
    name: chatwoot-web
    runtime: docker
    plan: starter
    # Uses the repo's Dockerfile by default
    healthCheckPath: /
    # Run DB create/migrate/seed each deploy (safe re-run)
    preDeployCommand: bash -lc "bundle exec rails db:chatwoot_prepare"
    # Start Puma, bind to $PORT
    dockerCommand: bash -lc "/app/docker/entrypoints/rails.sh && bundle exec rails s -p $PORT -b 0.0.0.0"
    envVars:
      - fromGroup: chatwoot-common
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatwoot-redis
          property: connectionString
    disk:
      name: chatwoot-uploads
      mountPath: /app/storage   # Chatwoot local ActiveStorage path
      sizeGB: 5                 # adjust as needed

  - type: worker
    name: chatwoot-worker
    runtime: docker
    plan: starter
    dockerCommand: bash -lc "/app/docker/entrypoints/rails.sh && bundle exec sidekiq -C config/sidekiq.yml"
    envVars:
      - fromGroup: chatwoot-common
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chatwoot-redis
          property: connectionString
